# Gate every push/PR on the same checks the deploy runs, so a build break is
# caught here — NOT at Cloud Build (which blocks the auto-deploy to Cloud Run).
# The web job runs the exact `npm run build` (tsc -b && vite build) the Dockerfile
# uses; the python job syntax-checks every module.
name: ci

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same ref cancels the in-flight run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: web build + lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build          # tsc -b && vite build — mirrors the Dockerfile

  python:
    name: python syntax check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # py_compile catches the syntax/f-string-version breaks that would fail the
      # image build, without installing the heavy (numpy/plotly/yfinance) stack.
      - name: Compile all Python modules
        run: python -m py_compile $(git ls-files '*.py')
      # Golden-value tests for the payoff core (no network). Importing core.note
      # pulls core/__init__ → calibrator (scipy) → simulator, so scipy is needed
      # even though the tests themselves only exercise the numpy payoff engine.
      # reportkit is the report ENGINE, pulled from its own repo at a pinned
      # tag — keep this URL in step with requirements.txt. It used to be a
      # directory in this repo, so before the extraction these jobs got it for
      # free from the checkout; now they do not.
      - name: Unit tests (quant core)
        run: |
          pip install pytest numpy pandas scipy "reportkit @ git+https://github.com/diegogomezpy/report_maker@v1.0.0"
          python -m pytest tests/ -q

  golden-pdf:
    name: golden PDF + layout invariants
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The report stack only — no yfinance, no Chrome. tests/test_golden_pdf.py
      # is hermetic: seeded fixtures, and figures stubbed inside _fig_to_png, so
      # Kaleido never boots. pypdfium2 rasterises the pages (BSD/Apache; PyMuPDF
      # is deliberately not a dependency here, see requirements.txt).
      # Both PDF suites: the golden pins the pixels, test_pdf_layout pins the
      # structural invariants (no heading orphaned from its block). The light
      # `python` job skips them both — importorskip("fpdf") — so if they are not
      # named here they run nowhere, which is what happened to the layout test.
      - name: Render the report, diff the baseline, check layout invariants
        run: |
          pip install pytest numpy pandas scipy fpdf2 plotly Pillow pypdfium2 "reportkit @ git+https://github.com/diegogomezpy/report_maker@v1.0.0"
          python -m pytest tests/test_golden_pdf.py tests/test_pdf_layout.py -q
